name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "🔄 Starting deployment process..."
            cd /var/www/momsMilk
            
            echo "📥 Pulling latest changes..."
            git pull origin production
            
            # Copy Firebase credentials if not exists
            if [ ! -f "src/config/credentials/firebase-service-account.json" ]; then
              echo "🔑 Setting up Firebase credentials..."
              mkdir -p src/config/credentials
              echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > src/config/credentials/firebase-service-account.json
            fi
            
            echo "⚙️ Creating environment file..."
            cat > .env << EOL
            NODE_ENV=production
            DATABASE_HOST=db
            DATABASE_PORT=5432
            DATABASE_USERNAME=postgres
            DATABASE_PASSWORD=BuspayDev@2024
            DATABASE_NAME=moms_milk_db
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            FIREBASE_SERVICE_ACCOUNT_PATH=src/config/credentials/firebase-service-account.json
            EOL
            
            echo "🐳 Stopping existing containers..."
            docker-compose down
            
            echo "🔍 Checking Docker logs before build..."
            docker ps -a
            
            echo "🏗️ Building and starting containers..."
            docker-compose up -d --build
            
            echo "⏳ Waiting for services to be ready..."
            sleep 15
            
            echo "🔍 Checking container status..."
            docker ps
            docker-compose logs app
            
            echo "📊 Checking database connection..."
            docker-compose exec -T db pg_isready -U postgres
            
            echo "🔄 Running database migrations..."
            docker-compose exec -T app npm run migration:run || {
              echo "❌ Migration failed. Checking logs..."
              docker-compose logs app
              exit 1
            }
            
            echo "🔍 Verifying API health..."
            for i in {1..5}; do
              if curl -f http://localhost:3000/api/health; then
                echo "✅ API is healthy!"
                break
              fi
              if [ $i -eq 5 ]; then
                echo "❌ API health check failed after 5 attempts"
                echo "📋 Checking container logs..."
                docker-compose logs app
                exit 1
              fi
              echo "⏳ Waiting for API to be ready... Attempt $i/5"
              sleep 10
            done
            
            echo "✅ Deployment completed successfully!"
